name: Validar codigo do relatorio
on:
  push:
    paths:
      - '*.py'
      - 'relatorio_config.json'
      - '.github/workflows/*.yml'
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests reportlab
      - run: python -m unittest test_relatorio_meta.py
