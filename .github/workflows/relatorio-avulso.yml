name: Relatorio avulso por periodo
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Data inicial (AAAA-MM-DD)"
        required: true
      until:
        description: "Data final (AAAA-MM-DD)"
        required: true
permissions:
  contents: write
concurrency:
  group: relatorios-meta
  cancel-in-progress: false
jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas
        run: pip install --quiet reportlab requests
      - name: Gerar relatorio
        env:
          RAW_ID: ${{ secrets.AD_ACCOUNT_ID }}
          TOKEN: ${{ secrets.META_TOKEN }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
          REPORT_SLOT: ${{ github.event.schedule == '15 10 * * *' && 'morning' || (github.event.schedule == '15 21 * * *' && 'evening' || '') }}
        run: python relatorio_meta.py
      - name: Guardar PDF e extracao completa
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-meta-${{ github.run_id }}
          path: |
            relatorios/*.pdf
            dados/*.json
          retention-days: 30
      - name: Salvar PDF no repositorio
        run: |
          git config user.name "relatorio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add relatorios
          if ! git diff --cached --quiet; then
            git commit -m "Relatorio Meta atualizado"
            git pull --rebase origin main
            git push
          fi
      - name: Enviar pelos canais configurados
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.EMAIL_REMETENTE }}
          GMAIL_PASS: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.EMAIL_DESTINO }}
        run: python enviar_meta.py

